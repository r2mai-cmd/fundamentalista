name: Sync public CVM data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cvm-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          API_URL: ${{ secrets.ATLAS_API_URL }}
          SYNC_TOKEN: ${{ secrets.ATLAS_SYNC_TOKEN }}
        run: |
          test -n "$API_URL" || (echo "Configure o secret ATLAS_API_URL com a URL base da API" && exit 1)
          test -n "$SYNC_TOKEN" || (echo "Configure o secret ATLAS_SYNC_TOKEN com o token de sincronização" && exit 1)
      - name: Trigger CVM synchronization
        env:
          API_URL: ${{ secrets.ATLAS_API_URL }}
          SYNC_TOKEN: ${{ secrets.ATLAS_SYNC_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            -X POST "${API_URL%/}/api/admin/sync" \
            -H "X-Atlas-Sync-Token: $SYNC_TOKEN" \
            -H "Accept: application/json"
