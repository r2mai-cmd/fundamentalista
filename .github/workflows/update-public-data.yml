name: Update public CVM data

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_public_data.py"
      - ".github/workflows/update-public-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cvm-public-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static CVM company directory
        run: python scripts/build_public_data.py
      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/companies.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh public CVM company directory"
            git pull --rebase origin main
            git push
          fi
