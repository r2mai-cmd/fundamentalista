services:
  - type: web
    name: atlas-fundamental-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://r2mai-cmd.github.io
      - key: ATLAS_DB_PATH
        value: /var/data/atlas.db
      - key: CVM_FINANCIAL_YEARS
        value: "5"
    disk:
      name: atlas-data
      mountPath: /var/data
      sizeGB: 1
